services:
  - type: web
    name: ichos-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: CLIENT_ORIGIN
        sync: false          # set manually in dashboard
      - key: OPENAI_API_KEY
        sync: false          # set manually in dashboard
      - key: YOUTUBE_API_KEY
        sync: false          # set manually in dashboard
      - key: CLIENT_ORIGINS
        value: https://chhata-aditya.github.io,https://ichos-player-web.onrender.com,http://localhost:5173,http://127.0.0.1:5173

  - type: web
    name: ichos-gesture
    runtime: python
    plan: free
    rootDir: gesture-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GESTURE_ALLOWED_ORIGINS
        value: https://chhata-aditya.github.io,https://ichos-player-web.onrender.com,http://localhost:5173,http://127.0.0.1:5173

  - type: web
    name: ichos-player-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://ichos-api.onrender.com/api
      - key: VITE_GESTURE_WS_URL
        value: wss://ichos-gesture.onrender.com/ws
    routes:
      - type: rewrite
        source: /player
        destination: /index.html
      - type: rewrite
        source: /search
        destination: /index.html
      - type: rewrite
        source: /vibe
        destination: /index.html
      - type: rewrite
        source: /visualizer
        destination: /index.html
